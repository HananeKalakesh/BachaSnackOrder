<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>منيو الباش</title>
<!-- The printed A3 menu (Arabic only), built from the Menu tab of the El Bash – Orders & Sales sheet: every row with a
     price, prices in K, sizes as grey lines under their card. Run make-a3.ps1 to fit the text and save the PDF and PNG
     into the El Bash Drive folder; opened in a browser, it shows the live menu. Only the design lives here. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=Cairo:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
@page{size:A3 landscape;margin:0}
*{box-sizing:border-box}
:root{--f:4.4mm;--h:8.36mm;--s:4.4mm;--pad:0.53mm;--gap:3.52mm}
html,body{margin:0;width:420mm;height:297mm;background:#FAF5EC;color:#1A1A17;font-family:Cairo,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:420mm;height:297mm;display:flex;flex-direction:column;padding:8mm 12mm 0}
header{position:relative;overflow:hidden;background:#1F4A37;color:#FAF5EC;border-radius:8mm;padding:4.5mm 10mm;display:flex;align-items:center;gap:10mm}
header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,0) 0 7mm,rgba(255,255,255,.035) 7mm 14mm)}
header>*{position:relative}
.lockup{width:50mm;display:flex;flex-direction:column;direction:ltr;flex:none}
.lockup img{width:100%;display:block}
.lockup span{margin-top:1.6mm;padding-left:5%;font:800 2.05mm 'Plus Jakarta Sans';letter-spacing:.34em;white-space:nowrap}
.info{flex:1;display:flex;flex-direction:column;align-items:center;gap:2mm;text-align:center}
.info h1{margin:0;font:400 15mm/1 Lalezar,Cairo,sans-serif}
.order{background:#C8102E;color:#fff;border-radius:99mm;padding:1.6mm 7mm;font-weight:800;font-size:5.4mm}
.hours{font-size:4.4mm;font-weight:700;line-height:1.3}
.qr{display:flex;align-items:center;gap:4mm;flex:none}
.qr .box{background:#fff;padding:2mm;border-radius:3.5mm;width:28mm;height:28mm}
.qr .box img{width:100%;height:100%;display:block}
.qr p{margin:0;width:44mm;color:#F2B705;font-weight:800;font-size:4.8mm;line-height:1.25}
.qr p .call{display:block;margin-top:2mm;font-size:4mm;color:#FAF5EC}
.qr p bdi{font-family:'Plus Jakarta Sans';font-weight:800}
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0 7mm;padding:4.5mm 0 0}
.col{min-height:0;overflow:hidden}
.sec{margin-bottom:var(--gap)}
h2{margin:0 0 1.4mm;padding-inline-start:1mm;font:400 var(--h)/1.1 Lalezar,Cairo,sans-serif;color:#1F4A37}
.card{background:#fff;border-radius:5mm;padding:1.4mm 5mm;border:.35mm solid #E6DDCC}
h3{display:flex;align-items:center;gap:2mm;margin:1.8mm 0 .2mm;color:#1F4A37;font-weight:800;font-size:var(--s)}
h3::after{content:'';flex:1;height:.35mm;background:#E6DDCC}
.row{display:flex;align-items:flex-end;gap:2.5mm;padding:var(--pad) 0;font-size:var(--f);line-height:1.15}
.name{display:flex;flex-direction:column;min-width:0}
.name b{font-weight:800}.name .nw{white-space:nowrap}
.dots{flex:1;min-width:3mm;border-bottom:.4mm dotted #1A1A1755;margin-bottom:.35em}
.price,.chips i{font-variant-numeric:tabular-nums}
.price{line-height:1.1;font-weight:800;color:#C8102E;white-space:nowrap;font-family:'Plus Jakarta Sans';direction:ltr;unicode-bidi:isolate}
.chips{display:flex;flex-direction:column;padding:0 0 var(--pad);padding-inline-start:4mm;font-size:calc(var(--f)*.9);line-height:1.15}
.chips span{white-space:nowrap;display:flex;align-items:flex-end;gap:2.5mm;padding:calc(var(--pad)*.4) 0}
.chips span::after{content:'';order:1;flex:1;min-width:3mm;border-bottom:.35mm dotted #1A1A1740;margin-bottom:.35em}
.chips b{color:#4A453E;font-weight:700}
.chips b::before{content:'\2013';margin-inline-end:1.5mm;color:#C9BFAE}
.row:has(+ .chips) .dots{visibility:hidden}
.chips i{order:2;font-style:normal;font-weight:800;color:#C8102E;font-family:'Plus Jakarta Sans';direction:ltr;unicode-bidi:isolate}
footer{display:flex;justify-content:space-between;align-items:center;gap:8mm;margin:2.5mm -12mm 0;padding:2.6mm 12mm;background:#C8102E;color:#fff;font-size:4.2mm;font-weight:800}
footer .note{background:#F2B705;border-radius:99mm;padding:1.1mm 6mm;color:#1A1A17}
footer .sig{display:flex;align-items:center;gap:3mm;font:400 6.2mm Lalezar,Cairo,sans-serif}
footer .sig img{width:8mm;height:8mm;padding:1.2mm;border-radius:50%;background:#1F4A37}
.err{padding:10mm;font-size:6mm;color:#C8102E}
</style></head><body><div class="page">
<header>
  <div class="lockup"><img src="../elbash/noar-green.svg" alt="El Bash"><span>CHICKEN &amp; SNACK</span></div>
  <div class="info">
    <h1>المنيو</h1>
    <div class="order">اطلب أونلاين من المنيو</div>
    <div class="hours">كل يوم من 1 لـ 4 الضهر ومن 6 لـ 11 المسا · مسكّرين يوم الاثنين</div>
  </div>
  <div class="qr"><div class="box"><img src="qr-menu.svg" alt=""></div><p>امسح الرمز لتشوف الصور وتطلب<span class="call">للاتصال <bdi>76 075 724</bdi></span></p></div>
</header>
<main></main>
<footer><span class="note">الأسعار بالليرة اللبنانية</span><span class="sig"><img src="../elbash/fez-paper.svg" alt="">تكرم يا باشا!</span><span>الأسعار ممكن تتغيّر حسب أسعار السوق</span></footer>
</div>
<script src="menu-data.js" onerror="this.remove()"></script>
<script>
const MENU_URL = 'https://script.google.com/macros/s/AKfycby7dthEIW4d2EF90fH6-_lGJEK_kAtu0XVSdARQUmM8w4iFEvBIfab-6SR9JdZmWDSdcA/exec?format=menu';
// The four columns: [section title, [[Menu category, its sub-heading (empty: none)], …]]
const LAYOUT = [
  [['مقبلات', [['Fries', 'بطاطا'], ['Appetizers', 'مقبلات أخرى']]], ['وجبات', [['Meals', '']]]],
  [['ساندويشات', [['Chicken Sandwiches', 'دجاج'], ['Beef Sandwiches', 'لحمة'], ['Other Sandwiches', 'ساندويشات تانية']]], ['صحون', [['Plates', '']]]],
  [['وجبات عائلية', [['Family Meals', '']]], ['برغر', [['Chicken Burgers', 'دجاج'], ['Beef Burgers', 'لحمة']]]],
  [['صوصات وإضافات', [['Sauces & Extras', 'أكواب الصوص'], ['Extras', 'إضافات']]], ['مشروبات', [['Drinks', '']]]]
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const K = n => Math.round(n / 1000).toLocaleString('en-US') + 'K';
// 'وجبة كريسبي 4 قطع' -> 'وجبة كريسبي'; a size on its own line: '7 PCS' -> '7 قطع', '1/2 KG' -> 'نص كيلو'
const sizeLess = n => String(n).replace(/\s+(\d+(?:[-\/]\d+)?\s*\S+|قطعتين|نص كيلو)$/, '');
function sizeAr(s) {
  const m = String(s).match(/^(\d+(?:\/\d+)?)\s*(PCS|KG)$/i);
  if (!m) return esc(s);
  if (/KG/i.test(m[2])) return m[1] === '1/2' ? 'نص كيلو' : m[1] + ' كيلو';
  return m[1] === '2' ? 'قطعتين' : m[1] + (+m[1] >= 3 && +m[1] <= 10 ? ' قطع' : ' قطعة');
}
// an item's Arabic name with its size kept on one line: 'موزاريلا ستيكس <span class="nw">6 قطع</span>'
function nameAr(ar) { const m = String(ar).match(/^(.*?)\s+(\d+(?:-\d+)?\s*\S+)$/); return m ? esc(m[1]) + ' <span class="nw">' + esc(m[2]) + '</span>' : esc(ar) }

function build(menu) {
  const rate = menu.rate || 89500, byCat = {};
  // every row with a price; rows with the same Card are one line with their sizes under it, cheapest first,
  // named after the row whose English name starts with the card's ("Wings Meal 14 PCS" for "Wings Meal")
  menu.items.forEach(r => {
    const price = r.price || r.usd * rate;
    if (!r.name || !price) return;
    const list = byCat[r.cat] = byCat[r.cat] || [];
    if (r.card) {
      let c = list.find(x => x.card === r.card);
      if (!c) list.push(c = {card: r.card, ar: '', own: false, sizes: []});
      const own = r.name.indexOf(r.card) === 0;
      if (!c.ar || own && !c.own) { c.ar = sizeLess(r.ar); c.own = own }
      c.sizes.push({label: r.size || r.name, price});
    } else list.push({ar: r.ar || r.name, price});
  });
  const row = x => x.sizes
    ? '<div class="row"><span class="name"><b>' + esc(x.ar) + '</b></span><span class="dots"></span></div><div class="chips">' +
      x.sizes.sort((a, b) => a.price - b.price).map(s => '<span><b>' + sizeAr(s.label) + '</b><i>' + K(s.price) + '</i></span>').join('') + '</div>'
    : '<div class="row"><span class="name"><b>' + nameAr(x.ar) + '</b></span><span class="dots"></span><span class="price">' + K(x.price) + '</span></div>';
  const used = new Set(), cols = LAYOUT.map(secs => secs.map(([title, cats]) => {
    const grps = cats.filter(([c]) => byCat[c] && byCat[c].length).map(([c, sub]) => { used.add(c); return '<div class="grp">' + (sub ? '<h3>' + sub + '</h3>' : '') + byCat[c].map(row).join('') + '</div>' });
    return grps.length ? '<div class="sec"><h2>' + title + '</h2><div class="card">' + grps.join('') + '</div></div>' : '';
  }).join(''));
  // a category the layout doesn't know yet: at the end of the last column, under its own name
  Object.keys(byCat).filter(c => !used.has(c)).forEach(c => { console.warn('Not in the A3 layout:', c); cols[3] += '<div class="sec"><h2>' + esc(c) + '</h2><div class="card"><div class="grp">' + byCat[c].map(row).join('') + '</div></div></div>' });
  document.querySelector('main').innerHTML = cols.map(c => '<div class="col">' + c + '</div>').join('');
}

// the biggest text that still fits every column (and every line in its column)
function fit() {
  const root = document.documentElement.style;
  const over = f => {
    root.setProperty('--f', f + 'mm'); root.setProperty('--h', (f * 1.9) + 'mm'); root.setProperty('--s', f + 'mm');
    root.setProperty('--pad', (f * .12) + 'mm'); root.setProperty('--gap', (f * .8) + 'mm');
    // in Arabic (right to left) text spilling to the left doesn't show in scrollWidth: measure the text itself
    const spill = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width - el.clientWidth - 1 };
    return Math.max(...[...document.querySelectorAll('.col')].map(c => c.scrollHeight - c.clientHeight),
      ...[...document.querySelectorAll('.row')].map(x => x.scrollWidth - x.clientWidth),
      ...[...document.querySelectorAll('.name b, .chips')].map(spill));
  };
  let lo = 2, hi = 8;
  for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; over(m) <= 0 ? lo = m : hi = m }
  const f = Math.floor(lo * 20) / 20; over(f);
  document.title = 'منيو الباش · ' + f + 'mm';
}

(window.MENU_DATA ? Promise.resolve(window.MENU_DATA) : fetch(MENU_URL).then(r => r.json()))
  .then(menu => { build(menu); return document.fonts.ready }).then(fit)
  .catch(e => { document.querySelector('main').innerHTML = '<p class="err">ما قدرنا نجيب المنيو: ' + esc(e.message) + '</p>' });
</script>
</body></html>
