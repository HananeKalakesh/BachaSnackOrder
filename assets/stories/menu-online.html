<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>El Bash story: menu online</title>
<!-- WhatsApp story (1080 × 1920); menu-online.png is this page rendered -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Lalezar&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF5EC;--green:#1F4A37;--deep:#173A2B;--red:#C8102E;--mustard:#F2B705;--ink:#1A1A17;--muted:#6B655C;--line:#E6DDCC;--sand:#EFE6D6}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Cairo,sans-serif;color:var(--paper);background:var(--green);position:relative;display:flex;flex-direction:column;align-items:center;padding:170px 80px 230px}
body.paper{background:var(--paper);color:var(--ink)}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(900px 760px at 50% 40%,rgba(242,183,5,.14),transparent 70%);pointer-events:none}
body.paper::before{background:radial-gradient(900px 760px at 50% 40%,rgba(31,74,55,.07),transparent 70%)}
body>*{position:relative}
.en{font-family:'Plus Jakarta Sans',sans-serif;direction:ltr;unicode-bidi:isolate}
.logo{width:180px;flex:none}
.kicker{flex:none;margin-top:26px;background:var(--mustard);color:var(--ink);font:800 42px/1 Cairo;padding:20px 42px;border-radius:999px;transform:rotate(-3deg);white-space:nowrap}
.kicker .en{font:800 28px/1 'Plus Jakarta Sans';margin-right:12px;letter-spacing:.06em;text-transform:uppercase}
h1{margin-top:22px;font:400 var(--h1,118px)/1.05 Lalezar,Cairo;text-align:center}
h1 span{color:var(--mustard)}
body.paper h1{color:var(--green)}
body.paper h1 span{color:var(--red)}
.sub{font:800 36px/1.25 'Plus Jakarta Sans';letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:8px;direction:ltr;text-align:center}
.photo{margin-top:26px;width:var(--ph,600px);height:var(--ph,600px);border-radius:56px;overflow:hidden;box-shadow:0 30px 70px -26px rgba(0,0,0,.55);border:10px solid var(--paper);position:relative;flex:none}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.price-tag{position:absolute;bottom:-1px;left:-1px;background:var(--red);color:#fff;border-radius:0 44px 0 0;padding:20px 36px 18px;font:800 54px/1 'Plus Jakarta Sans';direction:ltr}
.price-tag small{font-size:30px;font-weight:700;opacity:.9;margin-left:6px}
.desc{margin-top:26px;text-align:center;font:700 40px/1.3 Cairo;max-width:900px}
.desc .en{display:block;font:600 27px/1.3 'Plus Jakarta Sans';opacity:.75;margin-top:4px}
.cta{flex:none;margin-top:auto;width:100%;background:var(--red);color:#fff;border-radius:36px;padding:18px 36px;text-align:center;box-shadow:0 22px 50px -22px rgba(0,0,0,.5)}
.cta b{display:block;font:900 44px/1.2 Cairo}
.cta i{display:block;font:700 26px/1.3 'Plus Jakarta Sans';font-style:normal;opacity:.92;direction:ltr}
.cta span{display:block;margin-top:10px;font:800 28px/1.2 'Plus Jakarta Sans';direction:ltr;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 18px}
.call{flex:none;margin-top:12px;text-align:center;font:700 27px/1.2 Cairo;opacity:.85}
.call .en{font-weight:700;margin-right:8px}
.list{margin-top:28px;padding-block:8px !important;width:100%;background:var(--paper);color:var(--ink);border-radius:44px;padding:20px 44px;box-shadow:0 22px 50px -20px rgba(0,0,0,.4)}
body.paper .list{background:#fff;border:3px solid var(--line);box-shadow:none}
.li{display:flex;align-items:flex-end;gap:18px;padding:var(--lp,12px) 0;border-bottom:2px dashed var(--line)}
.li:last-child{border-bottom:0}
.li .n{display:flex;flex-direction:column}
.li .n b{font:800 var(--lf,40px)/1.15 Cairo}
.li .n i{font:600 25px/1.2 'Plus Jakarta Sans';font-style:normal;color:var(--muted);direction:ltr;text-align:right}
.li .d{flex:1}
.li .p{font:800 var(--lf,40px)/1.15 'Plus Jakarta Sans';color:var(--red);direction:ltr;white-space:nowrap}
.li .p small{font-size:26px;color:var(--muted);font-weight:700}
.note{margin-top:16px;font:700 30px/1.3 Cairo;opacity:.8;text-align:center}
.note .en{margin-right:8px;font-size:26px}

.steps{margin-top:54px;width:100%;display:flex;flex-direction:column;gap:22px}
.steps>div{display:flex;align-items:center;gap:30px;background:var(--paper);color:var(--ink);border-radius:40px;padding:26px 40px}
.steps b{flex:none;width:86px;height:86px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font:800 48px 'Plus Jakarta Sans'}
.steps p{font:800 48px/1.2 Cairo}
.steps i{display:block;font:700 28px/1.3 'Plus Jakarta Sans';font-style:normal;color:var(--muted)}
.paste{margin-top:54px;width:100%;height:190px;border:6px dashed rgba(250,245,236,.6);border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 44px/1.2 Cairo;color:var(--mustard)}
.paste .en{font:700 28px/1.3 'Plus Jakarta Sans';color:var(--paper);opacity:.7}
.url{margin-top:22px;font:800 34px/1 'Plus Jakarta Sans';direction:ltr;opacity:.85}
</style></head><body class="">
<img class="logo" src="../elbash/v4/noar-green.svg" alt="El Bash">

<div class="kicker">المنيو أونلاين<span class="en">Menu online</span></div>
<h1>اطلب <span>أونلاين</span><br>وبيوصلك سخن</h1>
<div class="sub">Order online from our menu</div>
<div class="steps">
  <div><b>1</b><p>افتح المنيو<i class="en">Open the menu</i></p></div>
  <div><b>2</b><p>اختار وزيد عالطلب<i class="en">Pick your food</i></p></div>
  <div><b>3</b><p>ابعت الطلب<i class="en">Send your order</i></p></div>
</div>
<div class="paste">حط رابط المنيو هون<span class="en">Link sticker here</span></div>
<div class="url">hananekalakesh.github.io/BachaSnackOrder</div>
<div class="call">لأي سؤال اتصل فينا <span class="en">Questions? Call 76 075 724</span></div>
</body></html>
