<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>El Bash new hours story</title>
<!-- WhatsApp story (1080 × 1920) for the new ordering hours; new-hours.png is this page rendered -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Lalezar&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF5EC;--green:#1F4A37;--deep:#173A2B;--red:#C8102E;--mustard:#F2B705;--ink:#1A1A17}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--green);overflow:hidden}
body{font-family:Cairo,sans-serif;color:var(--paper);display:flex;flex-direction:column;align-items:center;padding:100px 80px 100px;position:relative}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 38%,rgba(242,183,5,.13),transparent 70%)}
.logo{width:330px;position:relative}
.kicker{margin-top:60px;background:var(--mustard);color:var(--ink);font:800 44px/1 Cairo;padding:22px 46px;border-radius:999px;transform:rotate(-3deg);position:relative}
h1{margin-top:50px;font:400 150px/1.05 Lalezar,Cairo;color:var(--paper);text-align:center;position:relative}
h1 span{color:var(--mustard)}
.en-sub{font:800 40px/1.2 'Plus Jakarta Sans';letter-spacing:.18em;text-transform:uppercase;color:rgba(250,245,236,.75);margin-top:10px;direction:ltr;position:relative}
.slots{margin-top:70px;display:flex;flex-direction:column;gap:34px;width:100%;position:relative}
.slot{background:var(--paper);color:var(--ink);border-radius:44px;padding:40px 54px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 22px 50px -20px rgba(0,0,0,.45)}
.slot .t{font:400 118px/1 Lalezar,Cairo;color:var(--green);direction:ltr;letter-spacing:.01em}
.slot .t small{font:800 44px/1 'Plus Jakarta Sans';color:var(--red);margin-inline-start:6px}
.slot .l{text-align:right}
.slot .l b{display:block;font:900 54px/1.1 Cairo}
.slot .l i{display:block;font:700 30px/1.2 'Plus Jakarta Sans';font-style:normal;color:#6B655C;direction:ltr;text-align:right}
.mon{margin-top:56px;font:800 46px/1.3 Cairo;text-align:center;position:relative}
.mon i{display:block;font:700 32px/1.3 'Plus Jakarta Sans';font-style:normal;color:rgba(250,245,236,.7);direction:ltr}
.cta{margin-top:60px;background:var(--red);color:#fff;border-radius:40px;padding:34px 50px;width:100%;text-align:center;position:relative}
.cta b{display:block;font:900 52px/1.2 Cairo}
.cta span{display:block;margin-top:8px;font:800 58px/1 'Plus Jakarta Sans';direction:ltr;letter-spacing:.04em}
.sig{margin-top:34px;font:700 36px/1 Cairo;color:var(--mustard);position:relative}
</style></head><body>
<img class="logo" src="../elbash/v4/noar-green.svg" alt="El Bash">
<div class="kicker">مواعيد جديدة · New hours</div>
<h1>صرنا نستقبل <span>طلباتكن</span></h1>
<div class="en-sub">Order times</div>
<div class="slots">
  <div class="slot"><div class="t">1 <small>PM</small> – 4 <small>PM</small></div><div class="l"><b>الضهر</b><i>Afternoon</i></div></div>
  <div class="slot"><div class="t">6 <small>PM</small> – 11 <small>PM</small></div><div class="l"><b>المسا</b><i>Evening</i></div></div>
</div>
<div class="mon">كل يوم ما عدا الاثنين<i>Every day · closed on Mondays</i></div>
<div class="cta"><b>اطلب عالواتساب أو من المنيو</b><span>76 075 724</span></div>
<div class="sig">تكرم يا باشا!</div>
</body></html>
