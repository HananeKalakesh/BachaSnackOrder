<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Lalezar&family=Gochi+Hand&family=Luckiest+Guy&family=Marhey:wght@700&display=swap" rel="stylesheet">
<style>*{margin:0}body{background:transparent}.l{display:inline-block;padding:20px}</style></head><body>
<div class="l" id="sticker"><svg width="340" height="230" viewBox="0 0 340 230"><g transform="rotate(10 170 115)">
  <rect x="25" y="45" width="290" height="140" rx="70" fill="#FFC226" stroke="#1C1A15" stroke-width="9"/>
  <text x="170" y="150" text-anchor="middle" font-family="Lalezar" font-size="112" fill="#1C1A15">باشا</text></g></svg></div>
<div class="l" id="tagline"><svg width="900" height="200" viewBox="0 0 900 200"><defs><path id="a" d="M40 40 Q450 210 860 40"/></defs>
  <text font-family="Gochi Hand" font-size="86" fill="#7E150E" stroke="#7E150E" stroke-width="2.5" letter-spacing="7"><textPath href="#a" startOffset="50%" text-anchor="middle">CHICKEN &amp; SNACK</textPath></text></svg></div>
<!-- die-cut street stickers -->
<div class="l" id="s1"><svg width="520" height="360" viewBox="0 0 520 360"><g transform="rotate(-12 260 180)" font-family="Luckiest Guy" text-anchor="middle">
  <g stroke="#fff" stroke-width="44" stroke-linejoin="round" fill="#fff" filter="drop-shadow(6px 8px 0 rgba(0,0,0,.18))"><text x="260" y="170" font-size="150">YALLA</text><text x="260" y="300" font-size="150">EAT!</text></g>
  <text x="260" y="170" font-size="150" fill="#E8402A" stroke="#7E150E" stroke-width="6" paint-order="stroke">YALLA</text><text x="260" y="300" font-size="150" fill="#E8402A" stroke="#7E150E" stroke-width="6" paint-order="stroke">EAT!</text></g></svg></div>
<div class="l" id="s2"><svg width="420" height="260" viewBox="0 0 420 260"><g transform="rotate(8 210 130)">
  <rect x="30" y="50" width="360" height="160" rx="80" fill="#fff" filter="drop-shadow(6px 8px 0 rgba(0,0,0,.18))"/>
  <rect x="44" y="64" width="332" height="132" rx="66" fill="#7E150E"/>
  <text x="210" y="160" text-anchor="middle" font-family="Marhey" font-weight="700" font-size="84" fill="#FFC9D4">يلا كول</text></g></svg></div>
<div class="l" id="s3"><svg width="300" height="300" viewBox="0 0 300 300"><g transform="rotate(14 150 150)">
  <circle cx="150" cy="150" r="128" fill="#fff" filter="drop-shadow(6px 8px 0 rgba(0,0,0,.18))"/><circle cx="150" cy="150" r="112" fill="#FFC226"/>
  <text x="150" y="140" text-anchor="middle" font-family="Luckiest Guy" font-size="62" fill="#7E150E">HOT &amp;</text><text x="150" y="200" text-anchor="middle" font-family="Luckiest Guy" font-size="54" fill="#7E150E">CRISPY</text></g></svg></div>
</body></html>
