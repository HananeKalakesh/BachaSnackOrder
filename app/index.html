<title>El Bash Orders</title>
<script>
// One app, one link, four users: each iPad remembers who uses it (switched from the top bar).
// cashier: new order, today's orders, not paid today · kitchen: the kitchen screen (kitchen.html) · chef: recipes, stock ·
// marketing: photos, videos, stories, links · manage (PIN): overview, sales, not paid, expenses, income, costs · developer (PIN): the links, the
// website's hours. ?app=manage (manage.html) or ?role=… picks one.
var ROLE = (function () {
  var q = location.search, r = /[?&]app=manage\b/.test(q) ? 'manage' : (q.match(/[?&]role=(cashier|kitchen|chef|marketing|manage|developer)\b/) || [])[1];
  try { if (r) localStorage.setItem('elbash-role', r); else r = localStorage.getItem('elbash-role') } catch (e) {}
  return /^(cashier|kitchen|chef|marketing|manage|developer)$/.test(r || '') ? r : '';
})();
if (ROLE === 'kitchen') location.replace('kitchen.html' + location.search.replace(/[?&]role=kitchen/, '').replace(/^&/, '?'));
var MANAGE = ROLE === 'manage', LOCKED = MANAGE || ROLE === 'developer';   // LOCKED: asks for the PIN
document.documentElement.setAttribute('data-role', ROLE || 'none');
if (MANAGE) {
  document.documentElement.classList.add('manage');
  document.querySelector('link[rel=manifest]').href = 'manage.webmanifest';
  document.querySelector('meta[name=apple-mobile-web-app-title]').content = 'Bash Admin';
  document.title = 'El Bash Management';
}
</script>

    </div>

<!-- who uses this iPad (first time, or after "switch user") -->

    <div class="wgrid">
