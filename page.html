<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>El Bash Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87,900&family=Cairo:wght@600;700;800&family=Lalezar&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* El Bash design system v4: Basha Green leads on warm paper, white cards with soft green shadows, no borders,
   tarboush red only for the one main button, sauce mustard for small flags */
:root{--green:#1F4A37;--green-deep:#173A2B;--paper:#FAF5EC;--white:#fff;--sand:#EFE6D6;--input:#F3EBDD;--red:#C8102E;--mustard:#F2B705;
  --ink:#1A1A17;--body:#3F3B35;--muted:#6B655C;--placeholder:#8C8579;--hairline:#E6DDCC;--whish:#E4007C;
  --shadow:0 1px 2px rgba(31,74,55,.06),0 12px 32px -16px rgba(31,74,55,.18);--shadow-sm:0 1px 2px rgba(31,74,55,.06),0 8px 20px -12px rgba(31,74,55,.18);
  --shadow-cta:0 10px 24px -8px rgba(200,16,46,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:700 16px/1.35 Cairo,system-ui,sans-serif;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
/* One language at a time: the English / عربي button in the top bar switches body.lang-ar / body.lang-en */
.lang-ar .en,.lang-en .ar{display:none!important}
.lang-en,.lang-en .en{font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.display{font-family:Lalezar,Cairo,sans-serif;font-weight:400;letter-spacing:0}
.lang-en .display{font-family:Archivo,"Arial Narrow",sans-serif;font-weight:900;font-stretch:87%;text-transform:uppercase;line-height:.92}
.num{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* top bar: green, with the green-ground logo */
.top{height:68px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--green);color:var(--paper)}
.top .logo{height:48px;width:auto;flex:none}
.tabs{display:flex;gap:4px;background:rgba(250,245,236,.08);border:1.5px solid rgba(250,245,236,.3);padding:4px;border-radius:999px;margin-inline-start:auto}
.tabs button{height:42px;padding:0 20px;border-radius:999px;color:var(--paper);font-size:17px}
.tabs button.on{background:var(--paper);color:var(--green)}
.langbtn{height:44px;padding:0 18px;border-radius:999px;border:1.5px solid rgba(250,245,236,.3);background:rgba(250,245,236,.08);color:var(--paper);font-weight:800}
.langbtn .ar{font-family:Cairo,sans-serif}.langbtn .en{font-family:"Plus Jakarta Sans",sans-serif}
.net{font-size:14px;background:var(--mustard);color:var(--ink);padding:4px 12px;border-radius:999px;white-space:nowrap}
.net:empty{display:none}

/* order screen */
.order{display:grid;grid-template-columns:1fr 350px;height:calc(100% - 68px)}
.left{display:flex;flex-direction:column;min-width:0;min-height:0}
/* section pills: each in its section color; tapping one jumps to that section */
.cats{display:flex;gap:10px;overflow-x:auto;padding:12px 18px;scrollbar-width:none;flex:none;background:rgba(250,245,236,.92);border-bottom:1px solid var(--hairline)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:44px;padding:0 20px;border-radius:999px;background:var(--c);color:var(--f);font-size:16px;font-weight:600;white-space:nowrap;transition:box-shadow .15s}
.lang-ar .cats button{font-weight:700}
.cats button.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--c)}
.grid{position:relative;flex:1;overflow-y:auto;padding:4px 18px 40vh;-webkit-overflow-scrolling:touch}
.sec{padding-top:18px}
.sec h3{display:flex;align-items:center;gap:12px;margin:0 2px 12px;font-size:30px;line-height:1.1;color:var(--ink)}
.lang-en .sec h3{font-size:30px}
.sec h3::before{content:"";width:12px;height:28px;border-radius:999px;background:var(--c);flex:none}
.sec h3::after{content:"";flex:1;height:1px;background:var(--hairline)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.tile{position:relative;min-height:100px;padding:16px 14px 12px;border-radius:18px;background:var(--white);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:stretch;text-align:start;overflow:hidden;transition:transform .08s,background .12s}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.tile:active{transform:scale(.97)}
.tile b{font-weight:700;font-size:18px;line-height:1.25;color:var(--ink)}
.tile .pr{margin-top:auto;padding-top:8px;font:800 17px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:.02em;color:var(--muted);text-align:start}
.tile.has{background:var(--c)}
.tile.has b,.tile.has .pr{color:var(--f)}
.tile .q{position:absolute;top:12px;inset-inline-end:10px;min-width:36px;height:36px;padding:0 8px;border-radius:999px;background:var(--mustard);color:var(--ink);font:800 18px/36px "Plus Jakarta Sans",sans-serif;text-align:center;box-shadow:0 4px 10px -4px rgba(26,26,23,.3)}
.tile.has b{padding-inline-end:42px}

.right{background:var(--white);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;z-index:1}
.ticket{flex:1;overflow-y:auto;padding:14px 18px}
.ticket h2{margin:2px 0 6px;font-size:32px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.ticket h2 button{font:800 15px Cairo,sans-serif;color:var(--green);height:40px;padding:0 16px;border-radius:999px;background:var(--sand)}
.lang-en .ticket h2 button{font-family:"Plus Jakarta Sans",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:13px}
.empty{color:var(--muted);padding:24px 0;text-align:center;font-weight:600}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--hairline)}
.line i{width:10px;height:10px;border-radius:999px;background:var(--c);margin-top:8px}
.line .n{font-weight:700;font-size:17px}
.line .lt{font-weight:800;font-size:17px}
.stepper{display:flex;align-items:center;gap:8px;grid-column:2/-1}
.stepper button{width:52px;height:46px;border-radius:14px;background:var(--sand);color:var(--green);font:800 24px/1 "Plus Jakarta Sans",sans-serif}
.stepper > span{min-width:30px;text-align:center;font-size:20px;font-weight:800}
.stepper small{margin-inline-start:auto;color:var(--muted);font-size:13px;font-weight:600}

.pay{padding:14px 18px 18px;background:var(--paper);border-top:1px solid var(--hairline)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total .display{font-size:30px;color:var(--ink)}
.total b{display:block;font-size:28px;font-weight:800}
.total small{display:block;color:var(--muted);font-weight:700;text-align:end}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.methods button{height:64px;border-radius:14px;background:var(--sand);color:var(--ink);font-size:21px;font-weight:800}
.methods button.on[data-m=Cash]{background:var(--green);color:var(--paper)}
.methods button.on[data-m=Whish]{background:var(--whish);color:#fff}
.note{width:100%;margin-top:10px;height:52px;border-radius:16px;border:0;background:var(--input);padding:0 18px;font-size:16px;outline:none}
.note::placeholder{color:var(--placeholder)}
.note:focus{box-shadow:0 0 0 2px var(--green)}
.save{margin-top:12px;width:100%;height:70px;border-radius:999px;background:var(--red);color:#fff;font-weight:800;font-size:22px;box-shadow:var(--shadow-cta)}
.save:disabled{background:var(--sand);color:var(--muted);box-shadow:none}

/* report */
.report{height:calc(100% - 68px);overflow-y:auto;padding:18px;display:none}
.wrap{max-width:1100px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.filters .q button{height:44px;padding:0 20px;border-radius:999px;background:var(--sand);font-weight:600}
.filters .q button.on{background:var(--green);color:var(--paper)}
.filters label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.filters input{height:44px;border-radius:16px;border:0;background:var(--input);padding:0 12px;font-family:"Plus Jakarta Sans",sans-serif}
.q{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--white);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow)}
.kpi small{display:block;font-size:14px;color:var(--muted)}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:6px;text-align:start}
.kpi > span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.kpi.hero{background:var(--green);color:var(--paper)}.kpi.hero small,.kpi.hero span{color:rgba(250,245,236,.8)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.card{background:var(--white);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:26px;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:start;font-size:13px;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--hairline)}
td{padding:8px 4px;border-bottom:1px solid var(--hairline);vertical-align:top}
td.r,th.r{text-align:end}
.bar{height:6px;border-radius:3px;background:var(--mustard);margin-top:4px}
.del{color:var(--red);font-size:14px;padding:4px 6px}
.pin{max-width:340px;margin:60px auto;text-align:center}
.pin input{width:100%;height:60px;font-size:28px;text-align:center;letter-spacing:.4em;border-radius:16px;border:0;background:var(--input);margin:12px 0;outline:none;direction:ltr}
.pin button{width:100%;height:56px;border-radius:14px;background:var(--green);color:var(--paper);font-size:18px}
.err{color:var(--red);min-height:22px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:0 10px;border-radius:999px;font-size:13px;color:var(--paper);background:var(--green)}
.pill.Whish{background:var(--whish);color:#fff}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,140px);background:var(--green-deep);color:var(--paper);padding:14px 24px;border-radius:18px;font-weight:800;font-size:19px;text-align:center;transition:transform .25s;z-index:9;box-shadow:var(--shadow)}
.toast.show{transform:translate(-50%,0)}

@media (max-width:1000px){.order{grid-template-columns:1fr 310px}.tiles{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.cols{grid-template-columns:1fr}}
@media (max-width:700px){.order{grid-template-columns:1fr;grid-template-rows:1fr auto;height:auto;min-height:calc(100% - 68px)}.top .logo{height:38px}.tabs button{padding:0 12px}.grid{padding-bottom:20px}}
</style>
</head>
<body class="lang-ar">
<div class="top">
  <img class="logo" src="https://hananekalakesh.github.io/BachaSnackOrder/assets/elbash/noar-green.svg" alt="El Bash">
  <span class="net" id="net"></span>
  <div class="tabs"><button class="on" data-view="order"><span class="ar">طلب جديد</span><span class="en">New order</span></button><button data-view="report"><span class="ar">المبيعات</span><span class="en">Sales</span></button></div>
  <button class="langbtn" id="lang" type="button"><span class="ar">English</span><span class="en">عربي</span></button>
</div>

<div class="order" id="orderView">
  <div class="left">
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"><div class="muted" style="padding:20px"><span class="ar">عم يحمّل المنيو…</span><span class="en">Loading menu…</span></div></div>
  </div>
  <div class="right">
    <div class="ticket">
      <h2><span class="display"><span class="ar">الطلب</span><span class="en">Order</span></span> <button id="clear" type="button"><span class="ar">مسح</span><span class="en">Clear</span></button></h2>
      <div id="lines"></div>
    </div>
    <div class="pay">
      <div class="total"><span class="display"><span class="ar">المجموع</span><span class="en">Total</span></span><div><b class="num" id="tot">0 L.L.</b><small class="num" id="totUsd">$0.00</small></div></div>
      <div class="methods"><button data-m="Cash"><span class="ar">كاش</span><span class="en">Cash</span></button><button data-m="Whish"><span class="ar">ويش</span><span class="en">Whish</span></button></div>
      <input class="note" id="note" placeholder="ملاحظة (اختياري)" autocomplete="off">
      <button class="save" id="save" disabled></button>
    </div>
  </div>
</div>

<div class="report" id="reportView"><div class="wrap" id="rep"></div></div>
<div class="toast" id="toast"></div>

<script>
var MENU = [], RATE = 89500, CATS = [], cart = {}, method = '';
var QKEY = 'elbash-pos-queue', PKEY = 'elbash-pos-pin', LKEY = 'elbash-pos-lang';
var CAT_AR = {'All': 'الكل', 'Fries': 'بطاطا', 'Appetizers': 'مقبلات', 'Meals': 'وجبات', 'Family Meals': 'وجبات عائلية', 'Plates': 'صحون',
  'Chicken Sandwiches': 'ساندويشات دجاج', 'Beef Sandwiches': 'ساندويشات لحمة', 'Other Sandwiches': 'ساندويشات تانية',
  'Chicken Burgers': 'برغر دجاج', 'Beef Burgers': 'برغر لحمة', 'Sauces & Extras': 'صوصات وإضافات', 'Drinks': 'مشروبات'};
var PAY_AR = {Cash: 'كاش', Whish: 'ويش'};
// Section colors, one El Bash color per food group: [background, text on it]
var MUSTARD = ['#F2B705', '#1A1A17'], RED = ['#C8102E', '#FFFFFF'], GREEN = ['#1F4A37', '#FAF5EC'], INK = ['#1A1A17', '#FAF5EC'], SAND = ['#EFE6D6', '#1A1A17'];
var CAT_COLOR = {'Fries': MUSTARD, 'Appetizers': MUSTARD, 'Meals': RED, 'Family Meals': RED, 'Plates': RED,
  'Chicken Sandwiches': GREEN, 'Beef Sandwiches': GREEN, 'Other Sandwiches': GREEN, 'Chicken Burgers': INK, 'Beef Burgers': INK,
  'Sauces & Extras': SAND, 'Drinks': SAND};
function catColor(c) { return CAT_COLOR[c] || SAND }
function catVars(c) { var k = catColor(c); return '--c:' + k[0] + ';--f:' + k[1] }
// Words the colored section header already says are left off the menu buttons (the ticket keeps full names)
var SANDWICH = [/^ساندويش\s+/, /\s+Sandwich$/];
var TRIM = {'Family Meals': [/^وجبة عائلية\s+/, /\s+Family Meal/], 'Meals': [/^وجبة\s+/, /\s+Meal\b/], 'Plates': [/^صحن\s+/, /\s+Plate$/],
  'Chicken Sandwiches': SANDWICH, 'Beef Sandwiches': SANDWICH, 'Other Sandwiches': SANDWICH, 'Sauces & Extras': [/^صوص\s+/, /\s+Sauce$/]};
function trim(text, cat, k) { var t = TRIM[cat]; return t ? text.replace(t[k], '') || text : text }
var lang = 'ar';
function T(ar, en) { return lang === 'en' ? en : ar }
function $(s) { return document.querySelector(s) }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
function fmt(n) { return Math.round(n).toLocaleString('en-US') }
function short(n) { return n >= 1000 ? fmt(n / 1000) + 'K' : fmt(n) }  // 150,000 -> 150K on the menu buttons
function money(n) { return fmt(n) + ' L.L.' }
function usd(n) { return '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) }
function bi(ar, en) { return '<span class="ar">' + esc(ar) + '</span><span class="en">' + esc(en) + '</span>' }
function arName(en) { for (var i = 0; i < MENU.length; i++) if (MENU[i].name === en) return MENU[i].ar || en; return en }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v) } catch (e) { return null } }
function toast(arHtml, en) { var el = $('#toast'); el.innerHTML = '<span class="ar">' + arHtml + '</span><span class="en">' + esc(en) + '</span>'; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show') }, 2600) }

/* server calls: google.script.run wrapped in a promise */
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (ok, fail) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
    r[fn].apply(r, args);
  });
}

/* ---------- menu ---------- */
function loadMenu() {
  call('getMenu').then(function (m) {
    MENU = m.items; RATE = m.rate;
    CATS = []; MENU.forEach(function (it) { if (CATS.indexOf(it.cat) < 0) CATS.push(it.cat) });
    renderGrid(); renderCats(); renderCart();
  }, function (e) { $('#grid').innerHTML = '<div class="err" style="padding:20px">' + bi('ما قدرنا نحمّل المنيو. تأكد من الإنترنت وجرّب مرة تانية.', 'Could not load the menu. Check the internet and reload.') + '<br><small>' + esc(e.message || e) + '</small></div>' });
}
function renderGrid() {
  var grid = $('#grid'), top = grid.scrollTop;
  grid.innerHTML = CATS.map(function (c, k) {
    var h = '<section class="sec" id="sec' + k + '" style="' + catVars(c) + '"><h3 class="display">' + bi(CAT_AR[c] || c, c) + '</h3><div class="tiles">';
    MENU.forEach(function (it, i) {
      if (it.cat !== c) return;
      var q = cart[i] || 0;
      h += '<button class="tile' + (q ? ' has' : '') + '" data-i="' + i + '">' + (q ? '<span class="q">' + q + '</span>' : '') +
        '<b>' + bi(trim(it.ar || it.name, c, 0), trim(it.name, c, 1)) + '</b><span class="pr">' + short(it.price) + '</span></button>';
    });
    return h + '</div></section>';
  }).join('');
  grid.scrollTop = top;
}
function renderCats() {
  $('#cats').innerHTML = CATS.map(function (c, k) { return '<button data-k="' + k + '" style="' + catVars(c) + '">' + bi(CAT_AR[c] || c, c) + '</button>' }).join('');
  spy();
}
// Highlight the chip of the section at the top of the menu
function spy() {
  var grid = $('#grid'), cur = 0;
  CATS.forEach(function (c, k) { var el = document.getElementById('sec' + k); if (el && el.offsetTop - grid.scrollTop <= 40) cur = k });
  document.querySelectorAll('.cats button').forEach(function (b) {
    var on = +b.dataset.k === cur;
    if (on && !b.classList.contains('on')) b.scrollIntoView({block: 'nearest', inline: 'nearest'});
    b.classList.toggle('on', on);
  });
}
$('#grid').addEventListener('scroll', spy, {passive: true});
$('#cats').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  $('#grid').scrollTo({top: document.getElementById('sec' + b.dataset.k).offsetTop - 4, behavior: 'smooth'});
});
$('#grid').addEventListener('click', function (e) { var b = e.target.closest('.tile'); if (!b) return; var i = +b.dataset.i; cart[i] = (cart[i] || 0) + 1; renderGrid(); renderCart() });

/* ---------- ticket ---------- */
function total() { var t = 0; for (var i in cart) t += cart[i] * MENU[i].price; return t }
function renderCart() {
  var keys = Object.keys(cart);
  $('#lines').innerHTML = keys.length ? keys.map(function (i) {
    var it = MENU[i];
    return '<div class="line" style="' + catVars(it.cat) + '"><i></i><span class="n">' + bi(it.ar || it.name, it.name) + '</span><span class="lt num">' + fmt(cart[i] * it.price) + '</span>' +
      '<div class="stepper"><button data-d="1" data-i="' + i + '" aria-label="+1">+</button><span class="num">' + cart[i] + '</span><button data-d="-1" data-i="' + i + '" aria-label="-1">−</button>' +
      '<small>' + bi('الواحد', 'each') + ' <span class="num">' + fmt(it.price) + '</span></small></div></div>';
  }).join('') : '<div class="empty">' + bi('دق على الأصناف لتنضاف عالطلب.', 'Tap items to add them.') + '</div>';
  var t = total();
  $('#tot').textContent = money(t); $('#totUsd').textContent = usd(t / RATE);
  updateSave();
}
$('#lines').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-d]'); if (!b) return;
  var i = b.dataset.i; cart[i] += +b.dataset.d; if (cart[i] <= 0) delete cart[i];
  renderGrid(); renderCart();
});
$('#clear').addEventListener('click', function () { if (!Object.keys(cart).length || confirm(T('تمسح هالطلب؟', 'Clear this order?'))) resetOrder() });
function resetOrder() { cart = {}; method = ''; $('#note').value = ''; setMethod(''); renderGrid(); renderCart() }

function setMethod(m) { method = m; document.querySelectorAll('.methods button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === m) }); updateSave() }
document.querySelectorAll('.methods button').forEach(function (b) { b.addEventListener('click', function () { setMethod(b.dataset.m) }) });
function updateSave() {
  var t = total();
  $('#save').disabled = !(t && method);
  $('#save').innerHTML = !t || method ? bi('احفظ الطلب', 'Save order') : bi('اختار كاش أو ويش', 'Choose Cash or Whish');
}

/* ---------- saving, with an offline queue ---------- */
function queue() { try { return JSON.parse(store(QKEY) || '[]') } catch (e) { return [] } }
function setQueue(q) { store(QKEY, JSON.stringify(q)); showNet() }
function showNet() { var n = queue().length; $('#net').innerHTML = n ? bi(n + ' ناطر ينبعت', n + (n > 1 ? ' orders' : ' order') + ' waiting to send') : '' }

$('#save').addEventListener('click', function () {
  var order = {
    uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    at: new Date().toISOString(),
    items: Object.keys(cart).map(function (i) { return {name: MENU[i].name, qty: cart[i]} }),
    payment: method, note: $('#note').value.trim()
  };
  var q = queue(); q.push(order); setQueue(q);
  resetOrder();
  flush(true);
});

var flushing = false;
function flush(announce) {
  if (flushing) return; var q = queue(); if (!q.length) return;
  flushing = true;
  call('saveOrder', q[0]).then(function (r) {
    setQueue(queue().filter(function (o) { return o.uid !== q[0].uid }));
    flushing = false;
    if (announce) toast('انحفظ الطلب رقم <span class="num">' + r.num + '</span> · <span class="num">' + money(r.total) + '</span>', 'Order #' + r.num + ' saved');
    flush(announce);
  }, function (e) {
    flushing = false; showNet();
    if (/not on the menu/i.test(e.message || '')) { alert(e.message); setQueue(queue().slice(1)); return }
    if (announce) toast('ما في إنترنت، الطلب محفوظ وبينبعت لحالو', 'No internet: the order is kept and will send by itself');
  });
}
setInterval(function () { flush(false) }, 20000);
window.addEventListener('online', function () { flush(true) });

/* ---------- views ---------- */
document.querySelectorAll('.tabs button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b) });
    var rep = b.dataset.view === 'report';
    $('#orderView').style.display = rep ? 'none' : ''; $('#reportView').style.display = rep ? 'block' : 'none';
    if (rep) showReport();
  });
});

/* ---------- sales report ---------- */
var range = {from: '', to: '', key: 'today'};
function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) }
function preset(k) {
  var d = new Date(), f = new Date(d), t = new Date(d);
  if (k === 'yesterday') { f.setDate(d.getDate() - 1); t = new Date(f) }
  if (k === 'week') { f.setDate(d.getDate() - ((d.getDay() + 6) % 7)) }
  if (k === 'month') { f = new Date(d.getFullYear(), d.getMonth(), 1) }
  if (k === 'all') { f = new Date(2020, 0, 1) }
  range = {from: ymd(f), to: ymd(t), key: k};
}
function pin() { try { return sessionStorage.getItem(PKEY) || '' } catch (e) { return '' } }
function setPin(p) { try { sessionStorage.setItem(PKEY, p) } catch (e) {} }

function showReport() {
  if (!range.from) preset('today');
  loadReport();
}
function pinScreen(msg) {
  $('#rep').innerHTML = '<div class="pin"><h2 class="display" style="color:var(--green);font-size:30px;margin:0">' + bi('المبيعات', 'Sales') + '</h2><p class="muted">' + bi('اكتب الرمز', 'Enter the PIN') + '</p>' +
    '<input id="pinIn" type="password" inputmode="numeric" autocomplete="off"><div class="err">' + msg + '</div><button id="pinGo">' + bi('افتح', 'Open') + '</button></div>';
  var go = function () { setPin($('#pinIn').value); showReport() };
  $('#pinGo').onclick = go; $('#pinIn').onkeydown = function (e) { if (e.key === 'Enter') go() }; $('#pinIn').focus();
}
function loadReport() {
  $('#rep').innerHTML = filters() + '<p class="muted">' + bi('عم يحمّل…', 'Loading…') + '</p>'; bindFilters();
  call('getReport', pin(), range.from, range.to).then(renderReport, function (e) {
    if (/PIN/.test(e.message || '')) { var had = pin(); setPin(''); return pinScreen(had ? bi('الرمز غلط', 'Wrong PIN') : '') }
    $('#rep').innerHTML = filters() + '<p class="err">' + bi('ما قدرنا نحمّل المبيعات', 'Could not load the report') + '<br><small>' + esc(e.message || e) + '</small></p>'; bindFilters();
  });
}
function filters() {
  var q = [['today', 'اليوم', 'Today'], ['yesterday', 'مبارح', 'Yesterday'], ['week', 'هالجمعة', 'This week'], ['month', 'هالشهر', 'This month'], ['all', 'كل الوقت', 'All time']];
  return '<div class="filters"><div class="q">' + q.map(function (x) { return '<button data-k="' + x[0] + '" class="' + (range.key === x[0] ? ' on' : '') + '">' + bi(x[1], x[2]) + '</button>' }).join('') + '</div>' +
    '<div><label for="fFrom">' + bi('من', 'From') + '</label><input type="date" id="fFrom" value="' + range.from + '"></div>' +
    '<div><label for="fTo">' + bi('لـ', 'To') + '</label><input type="date" id="fTo" value="' + range.to + '"></div></div>';
}
function bindFilters() {
  document.querySelectorAll('.filters .q button').forEach(function (b) { b.onclick = function () { preset(b.dataset.k); loadReport() } });
  var ch = function () { range = {from: $('#fFrom').value, to: $('#fTo').value, key: ''}; if (range.from && range.to) loadReport() };
  $('#fFrom').onchange = ch; $('#fTo').onchange = ch;
}
function kpi(ar, en, big, small, hero) { return '<div class="kpi' + (hero ? ' hero' : '') + '"><small>' + bi(ar, en) + '</small><b class="num">' + big + '</b>' + (small ? '<span>' + small + '</span>' : '') + '</div>' }
function itemsAr(text) {
  return String(text).split(', ').map(function (p) { var m = p.match(/^(\d+) × (.*)$/); return m ? m[1] + ' × ' + arName(m[2]) : p }).join('، ');
}
function renderReport(r) {
  var s = r.summary, h = filters();
  h += '<div class="kpis">' +
    kpi('المبيعات', 'Sales', money(s.sales), '<span class="num">' + usd(s.sales / r.rate) + '</span>', true) +
    kpi('الطلبات', 'Orders', fmt(s.orders), s.orders ? bi('المعدل', 'Average') + ' <span class="num">' + money(s.sales / s.orders) + '</span>' : '') +
    kpi('الأصناف', 'Items sold', fmt(s.items), '') +
    kpi('كاش', 'Cash', money(s.cashLbp), '<span class="num">' + fmt(s.cashOrders) + '</span> ' + bi('طلب', 'orders')) +
    kpi('ويش', 'Whish', money(s.whishLbp), '<span class="num">' + fmt(s.whishOrders) + '</span> ' + bi('طلب', 'orders')) +
    '</div>';
  var max = r.items.length ? r.items[0].qty : 1;
  h += '<div class="cols"><div class="card"><h3 class="display">' + bi('الأصناف المباعة', 'Items sold') + '</h3>' + (r.items.length ?
    '<table><tr><th>' + bi('الصنف', 'Item') + '</th><th class="r">' + bi('العدد', 'Qty') + '</th><th class="r">L.L.</th></tr>' + r.items.map(function (x) {
      return '<tr><td>' + bi(arName(x.name), x.name) + '<div class="bar" style="width:' + Math.max(4, x.qty / max * 100) + '%"></div></td><td class="r num"><b>' + fmt(x.qty) + '</b></td><td class="r num">' + fmt(x.sales) + '</td></tr>' }).join('') + '</table>'
    : '<p class="muted">' + bi('ما في طلبات بهالتواريخ', 'No orders in these dates') + '</p>') + '</div><div>';
  if (r.days.length > 1) h += '<div class="card"><h3 class="display">' + bi('حسب اليوم', 'By day') + '</h3><table><tr><th>' + bi('التاريخ', 'Date') + '</th><th class="r">' + bi('طلبات', 'Orders') + '</th><th class="r">L.L.</th></tr>' +
    r.days.map(function (d) { return '<tr><td class="num">' + d.date + '</td><td class="r num">' + d.orders + '</td><td class="r num">' + fmt(d.sales) + '</td></tr>' }).join('') + '</table></div>';
  if (r.orders) h += '<div class="card"><h3 class="display">' + bi('الطلبات', 'Orders') + '</h3>' + (r.orders.length ? '<table><tr><th>#</th><th>' + bi('الأصناف', 'Items') + '</th><th class="r">' + bi('المجموع', 'Total') + '</th><th></th></tr>' +
    r.orders.map(function (o) {
      return '<tr><td><b class="num">' + o.num + '</b><div class="muted num">' + o.time + '</div></td><td>' + bi(itemsAr(o.items), o.items) + '<div><span class="pill ' + o.payment + '">' + bi(PAY_AR[o.payment] || o.payment, o.payment) + '</span></div></td><td class="r num">' + fmt(o.total) +
        '</td><td><button class="del" data-d="' + o.date + '" data-n="' + o.num + '">' + bi('امسح', 'Delete') + '</button></td></tr>' }).join('') + '</table>' : '<p class="muted">' + bi('لسا ما في طلبات', 'No orders yet') + '</p>') + '</div>';
  else h += '<div class="card"><p class="muted" style="margin:0">' + bi('اختار 3 أيام أو أقل لتشوف كل طلب', 'Pick up to 3 days to see each order') + '</p></div>';
  h += '</div></div>';
  $('#rep').innerHTML = h; bindFilters();
  document.querySelectorAll('.del').forEach(function (b) {
    b.onclick = function () {
      if (!confirm(T('تمسح الطلب رقم ' + b.dataset.n + ' (' + b.dataset.d + ')؟', 'Delete order #' + b.dataset.n + ' (' + b.dataset.d + ')?'))) return;
      call('deleteOrder', pin(), b.dataset.d, +b.dataset.n).then(function () { toast('انمسح الطلب', 'Order deleted'); loadReport() }, function (e) { alert(e.message || e) });
    };
  });
}

/* ---------- language ---------- */
function setLang(l) {
  lang = l === 'en' ? 'en' : 'ar'; store(LKEY, lang);
  document.body.className = 'lang-' + lang;
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  $('#note').placeholder = T('ملاحظة (اختياري)', 'Note (optional)');
  if (MENU.length) { renderGrid(); renderCats() }
}
$('#lang').addEventListener('click', function () { setLang(lang === 'en' ? 'ar' : 'en') });

setLang(store(LKEY) || 'ar'); showNet(); updateSave(); loadMenu(); flush(true);
</script>
</body>
</html>
